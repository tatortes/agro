<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recuperação de carrinho</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <!-- Fonte personalizada -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #000000; /* Fundo preto */
      color: #fff; /* Texto branco */
    }

    .overlay {
      background: rgba(0, 0, 0, 0.7); /* camada escura para o contraste */
      min-height: 100vh;
      padding-top: 50px;
      padding-bottom: 50px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9); /* fundo suave para o cartão */
      border: none;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-success {
      background-color: #FFD700;
      border: none;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-success:hover {
      background-color: #ffcc00;
      transform: scale(1.05);
      transition: all 0.3s ease;
    }

    .form-control {
      border-radius: 15px;
    }

    .whatsapp-icon {
      font-size: 3rem;
      color: #ffffff;
      animation: glow 1.5s infinite alternate;
    }

    .footer {
      font-size: 1.2rem;
      text-align: center;
      color: #FFD700;
      margin-top: 3rem;
      font-weight: bold;
    }

    .title-magnata {
      font-family: 'Poppins', sans-serif;
      font-size: 5rem;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.6);
      animation: pop 1s ease-in-out;
      letter-spacing: 5px;
    }

    .subtitle-magnata {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      color: #ffffff;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.6);
      margin-top: 15px;
    }

    @keyframes pop {
      0% {
        transform: scale(0.9);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes glow {
      0% {
        text-shadow: 0 0 10px #FFD700, 0 0 20px #FFD700, 0 0 30px #FFD700;
      }
      100% {
        text-shadow: 0 0 20px #ffcc00, 0 0 30px #ffcc00, 0 0 40px #ffcc00;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="text-center mb-4">
            <i class="fab fa-whatsapp whatsapp-icon"></i>
            <h2 class="title-magnata mt-2">Magnata</h2>
            <p class="subtitle-magnata">Envie mensagens personalizadas com apenas alguns cliques para recuperar as vendas que você perdeu. Seja o mestre das vendas!</p>
          </div>

          <div class="card p-4">
            <form action="/enviar" method="post" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="file" class="form-label">Selecione a planilha (.xlsx)</label>
                <input type="file" class="form-control" id="file" name="file" accept=".xlsx" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success">
                  <i class="fas fa-paper-plane me-2"></i>Enviar mensagem e recuperar vendas agora
                </button>
              </div>
            </form>
          </div>

          <div class="footer">
            Desenvolvido com estilo pelo Magnata ??
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
